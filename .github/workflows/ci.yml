name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check the version follows semver.org
        run: |
          git fetch --tags --force --quiet
          uv run python scripts/check_version.py
      - name: Audit dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements.txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
