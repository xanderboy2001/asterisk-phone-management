[project]
name = "asterisk-phone-management"
version = "0.1.0"
description = "A Python module to manage the Asterisk Phone system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.141.1",
  "nicegui>=3.16.0",
  "pexpect>=4.9.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.4",
  "questionary>=2.1.1",
  "rich>=15.0.0",
  "starlette>=1.9.0",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
menu = "asterisk_phone_management.main:main"

[dependency-groups]
dev = [
  "conventional-commits-check>=2.9.0",
  "httpx2>=2.12.0",
  "hypothesis>=6.170.2",
  "pre-commit>=4.6.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=5.0.0",
  "ruff==0.17.1",
  "ty==0.0.89",
  "types-pexpect>=4.9.0.20260518",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.14"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "asterisk_phone_management.api.app:app"

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
preview = true
extend-select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "D",
  "DOC",
  "E",
  "EM",
  "FBT",
  "G",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PL",
  "PTH",
  "PYI",
  "RUF",
  "SIM",
  "TID",
  "UP",
  "W",
]
ignore = [
  "missing-trailing-comma",
  "single-line-implicit-string-concatenation",
  # ruff only sees `raise` written directly in a function, so Raises:
  # entries for exceptions raised by helpers (ensure_valid, ask) are
  # reported as extraneous. Those entries are correct; keep them.
  "docstring-extraneous-exception",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "boolean-type-hint-positional-argument",
  "line-too-long",
  "magic-value-comparison",
  "import-private-name",
  "undocumented-public-function",
  "unused-lambda-argument",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
main_file = "src/asterisk_phone_management/api/app.py"
addopts = [
  "-ra",
  "-q",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--cov=asterisk_phone_management",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=89",
  "-p",
  "nicegui.testing.user_plugin",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["asterisk_phone_management"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload"]
