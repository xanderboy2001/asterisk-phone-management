[project]
name = "asterisk-phone-management"
version = "0.1.0"
description = "A Python module to manage the Asterisk Phone system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pexpect>=4.9.0", "questionary>=2.1.1", "rich>=15.0.0"]

[dependency-groups]
dev = [
  "conventional-commits-check>=2.9.0",
  "pre-commit>=4.6.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.16.1",
  "ty>=0.0.69",
  "types-pexpect>=4.9.0.20260518",
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
preview = true
extend-select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "D",
  "DOC",
  "E",
  "EM",
  "FBT",
  "G",
  "I",
  "ICN",
  "LOG",
  "N",
  "PERF",
  "PL",
  "PTH",
  "PYI",
  "RUF",
  "SIM",
  "TID",
  "UP",
  "W",
]
ignore = ["missing-trailing-comma", "single-line-implicit-string-concatenation"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "boolean-type-hint-positional-argument",
  "line-too-long",
  "magic-value-comparison",
  "import-private-name",
  "undocumented-public-function",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "-q",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--cov=src",
  "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error", "ignore::DeprecationWarning"]
